    <main>
        <section class="encabezado">
            <h1>Configuración</h1>
        </section>

        <!-- Datos del negocio -->
        <section class="config-seccion">
            <h2>Datos del Negocio</h2>
            <div class="campo">
                <label>Nombre del negocio</label>
                <input type="text" id="config-nombre">
            </div>
            <div class="campo">
                <label>NIT</label>
                <input type="text" id="config-nit">
            </div>
            <div class="campo">
                <label>Teléfono</label>
                <input type="text" id="config-telefono">
            </div>
            <div class="campo">
                
                <label>Dirección</label>
                <input type="text" id="config-direccion">
            </div>
            <div class="campo">
                <label>Horario apertura</label>
                <input type="time" id="config-apertura">
            </div>
            <div class="campo">
                <label>Horario cierre</label>
                <input type="time" id="config-cierre">
            </div>
            <div class="campo">
                <label>Días de atención</label>
                <input type="text" id="config-dias" placeholder="Ej: Lunes a Domingo">
            </div>
            <button onclick="guardarConfig()">Guardar cambios</button>
        </section>

        <!-- Cambiar contraseña -->
        <section class="config-seccion">
            <h2>Cambiar Contraseña</h2>
            <div class="campo">
                <label>Contraseña actual</label>
                <input type="password" id="password-actual">
            </div>
            <div class="campo">
                <label>Nueva contraseña</label>
                <input type="password" id="password-nueva">
            </div>
            <div class="campo">
                <label>Confirmar nueva contraseña</label>
                <input type="password" id="password-confirmar">
            </div>
            <button onclick="cambiarPassword()">Cambiar contraseña</button>
        </section>
        <br>
        <div>
            <button onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </main>

    <footer class="f-contacto">
