<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="css/stylesLogin.css">
</head>
<body>
    <main>
        <section class="inicio">
            <form class="formulario-sesion">
                <div href="#" class="logo">Anto<span class="tienda">Jitos</span></div>
                <fieldset>
                    <legend>Inicio de Sesión</legend>
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Correo" required>
                                
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>

                    <button class="iniciar-s-btn" type="submit" id="iniciar-sesion" name="iniciar-sesion">Iniciar sesión</button> 
                    <div style="display: flex; gap: 70px;">
                        <a href="recuperarContrasena.html" class="recuperar-pass">¿Olvido su contraseña?</a>
                        <a href="registrarse.html" class="registrar-ususario">Registrarse</a>
                    </div>
                    
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 <span>AntoJitos</span> - Todos los derechos reservados.</p>
    </footer>
    <script src="/js/login.js"></script>
</body>
</html>
