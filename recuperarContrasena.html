<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/stylesLogin.css">
</head>
<body>
    <header>
        <div class="logo">Anto<span class="tienda">Jitos</span></div>
    </header>

    <main>
        <section class="recuperar">
            <form class="formulario-recuperar-contrasena">
                <fieldset>
                    <legend>Recuperar Contraseña</legend>
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Correo" required>
                    <button class="enviar-codigo-btn" type="submit" id="enviar-codigo-btn" name="enviar-codigo-btn">Enviar codigo</button> 
                    <button class="volver-btn" type="submit" id="volver-btn" name="volver-btn">volver</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 <span>AntoJitos</span> - Todos los derechos reservados.</p>
    </footer>

    <script src="/js/login.js"></script>
</body>
</html>
